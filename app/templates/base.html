<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HRIS Import Preview{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 72rem; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.5rem; } h2 { font-size: 1.15rem; margin-top: 2rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 0.5rem; font-size: 0.9rem; }
    th, td { border: 1px solid #ccc; padding: 0.35rem 0.6rem; text-align: left; vertical-align: top; }
    th { background: #f2f2f2; }
    .summary span { display: inline-block; background: #eef4ff; border: 1px solid #ccd9f0;
                    border-radius: 6px; padding: 0.5rem 0.9rem; margin-right: 0.5rem; }
    .summary b { font-size: 1.1rem; }
    .error-row td { background: #fff2f2; }
    .badge { display: inline-block; font-family: monospace; font-size: 0.75rem;
             background: #eee; border-radius: 4px; padding: 0.05rem 0.4rem; }
    .none { color: #555; font-style: italic; }
    form { margin: 1.5rem 0; padding: 1rem; border: 1px solid #ddd; border-radius: 8px; }
    button, input[type="submit"] { padding: 0.45rem 1rem; }
    code { background: #f5f5f5; padding: 0 0.25rem; }
  </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
